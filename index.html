<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>N-Back Math</title>
    <link rel="stylesheet" href="style.css?v=20260508d" />
  </head>
  <body>
    <main class="shell">
      <section class="hero-panel">
        <div class="hero-row">
          <div class="hero-copy">
            <h1>N-Back Math</h1>
            <p class="current-level" id="current-level-label">Slow 1-back</p>
          </div>

          <div class="top-actions">
            <button class="primary" id="start-btn" type="button">Start</button>
            <button class="secondary" id="reset-btn" type="button">
              Reset
            </button>
            <button
              class="icon-button"
              id="settings-btn"
              type="button"
              aria-expanded="false"
              aria-controls="settings-sheet"
              aria-label="Open settings"
            >
              <span aria-hidden="true">⚙</span>
            </button>
          </div>
        </div>
      </section>

      <section class="console">
        <div class="screen-wrap">
          <div class="screen-chrome">
            <span
              class="result-badge"
              id="result-badge"
              aria-live="polite"
            ></span>
            <span class="phase-badge" id="phase-badge">Idle</span>
          </div>
          <div class="screen">
            <div class="timer-track" aria-hidden="true">
              <div class="timer-fill" id="timer-fill"></div>
            </div>
            <div class="problem-display" id="problem-display">-</div>
          </div>
        </div>

        <section class="answer-panel">
          <div class="answer-shell">
            <div class="answer-row">
              <div class="answer-value empty" id="answer-value">0</div>
              <button class="answer-clear" id="clear-btn" type="button">
                CLR
              </button>
            </div>
          </div>
          <div class="keypad" id="keypad"></div>
        </section>
      </section>

      <div class="settings-scrim" id="settings-scrim" hidden></div>
      <section class="settings-sheet" id="settings-sheet" hidden>
        <div class="settings-head">
          <div>
            <p class="sheet-label">Settings</p>
            <h2>Game Setup</h2>
          </div>
          <button
            class="icon-button subtle"
            id="close-settings-btn"
            type="button"
            aria-label="Close settings"
          >
            <span aria-hidden="true">✕</span>
          </button>
        </div>

        <div class="level-stepper" aria-label="Game level">
          <button
            class="level-button"
            id="level-down-btn"
            type="button"
            aria-label="Decrease level"
          >
            -
          </button>
          <div class="level-readout">
            <span>Level</span>
            <strong id="level-value">Slow 1-back</strong>
          </div>
          <button
            class="level-button"
            id="level-up-btn"
            type="button"
            aria-label="Increase level"
          >
            +
          </button>
        </div>

        <section class="settings-results">
          <div class="settings-results-head">
            <p class="sheet-label">Run Summary</p>
            <span class="results-phase" id="results-phase">Idle</span>
          </div>

          <dl class="stats-grid compact">
            <div>
              <dt>Round</dt>
              <dd id="round-count">0 / 24</dd>
            </div>
            <div>
              <dt>Answered</dt>
              <dd id="question-count">0</dd>
            </div>
            <div>
              <dt>Correct</dt>
              <dd id="correct-count">0</dd>
            </div>
            <div>
              <dt>Missed</dt>
              <dd id="missed-count">0</dd>
            </div>
            <div>
              <dt>Accuracy</dt>
              <dd id="accuracy-count">0%</dd>
            </div>
            <div>
              <dt>Streak</dt>
              <dd id="streak-count">0</dd>
            </div>
          </dl>
        </section>
      </section>
    </main>

    <script src="app.js?v=20260508e"></script>
  </body>
</html>
