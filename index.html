<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>N-Back Math</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero-panel">
        <div class="hero-row">
          <div class="hero-copy">
            <h1>N-Back Math</h1>
          </div>

          <div class="top-actions">
            <button class="primary" id="start-btn" type="button">Start</button>
            <button class="secondary" id="reset-btn" type="button">Reset</button>
            <button class="icon-button" id="settings-btn" type="button" aria-expanded="false" aria-controls="settings-sheet" aria-label="Open settings">
              <span aria-hidden="true">⚙</span>
            </button>
          </div>
        </div>
      </section>

      <section class="console">
        <div class="screen-wrap">
          <div class="screen-chrome">
            <span class="result-badge" id="result-badge" aria-live="polite"></span>
            <span id="phase-badge">Idle</span>
          </div>
          <div class="screen">
            <div class="timer-track" aria-hidden="true">
              <div class="timer-fill" id="timer-fill"></div>
            </div>
            <div class="problem-display" id="problem-display">-</div>
          </div>
        </div>

        <section class="answer-panel">
          <div class="answer-value empty" id="answer-value">0</div>
          <div class="keypad" id="keypad"></div>
        </section>
      </section>

      <div class="settings-scrim" id="settings-scrim" hidden></div>
      <section class="settings-sheet" id="settings-sheet" hidden>
        <div class="settings-head">
          <div>
            <p class="sheet-label">Settings</p>
            <h2>Game Setup</h2>
          </div>
          <button class="icon-button subtle" id="close-settings-btn" type="button" aria-label="Close settings">
            <span aria-hidden="true">✕</span>
          </button>
        </div>

        <div class="controls-grid">
          <label>
            <span>N Level</span>
            <select id="n-level">
              <option value="1" selected>1-back</option>
              <option value="2">2-back</option>
              <option value="3">3-back</option>
              <option value="4">4-back</option>
              <option value="5">5-back</option>
              <option value="6">6-back</option>
              <option value="7">7-back</option>
              <option value="8">8-back</option>
              <option value="9">9-back</option>
              <option value="10">10-back</option>
              <option value="11">11-back</option>
              <option value="12">12-back</option>
            </select>
          </label>

          <label>
            <span>Scored Rounds</span>
            <select id="rounds">
              <option value="10">10</option>
              <option value="15" selected>15</option>
              <option value="20">20</option>
              <option value="30">30</option>
            </select>
          </label>

          <label>
            <span>Speed</span>
            <select id="answer-ms">
              <option value="3000" selected>Slow</option>
              <option value="1000">Fast</option>
            </select>
          </label>

          <label>
            <span>Operators</span>
            <select id="operator-mode">
              <option value="add" selected>Add Only</option>
              <option value="mixed">Add + Subtract</option>
            </select>
          </label>

          <label>
            <span>Max Digit</span>
            <select id="digit-max">
              <option value="5">0-5</option>
              <option value="9" selected>0-9</option>
            </select>
          </label>
        </div>

        <section class="settings-results">
          <div class="settings-results-head">
            <p class="sheet-label">Run Summary</p>
            <span class="results-phase" id="results-phase">Idle</span>
          </div>

          <dl class="stats-grid compact">
            <div>
              <dt>Round</dt>
              <dd id="round-count">0 / 15</dd>
            </div>
            <div>
              <dt>Answered</dt>
              <dd id="question-count">0</dd>
            </div>
            <div>
              <dt>Correct</dt>
              <dd id="correct-count">0</dd>
            </div>
            <div>
              <dt>Missed</dt>
              <dd id="missed-count">0</dd>
            </div>
            <div>
              <dt>Accuracy</dt>
              <dd id="accuracy-count">0%</dd>
            </div>
            <div>
              <dt>Streak</dt>
              <dd id="streak-count">0</dd>
            </div>
          </dl>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
