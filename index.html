<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>N-Back Math</title>
    <link rel="stylesheet" href="style.css?v=20260509a" />
  </head>
  <body>
    <main class="shell">
      <section class="view active" id="game-view" aria-label="Game">
        <section class="trainer-console" aria-label="Game console">
          <div class="console-top">
            <button class="primary" id="start-btn" type="button">
              Start
            </button>

            <div class="level-stepper" aria-label="Game level">
              <button
                class="level-button"
                id="level-down-btn"
                type="button"
                aria-label="Decrease level"
              >
                -
              </button>
              <div class="level-readout">
                <span>Level</span>
                <strong id="level-value">Slow 1-back</strong>
              </div>
              <button
                class="level-button"
                id="level-up-btn"
                type="button"
                aria-label="Increase level"
              >
                +
              </button>
            </div>

            <button class="secondary" id="stats-tab" type="button">
              Stats
            </button>
          </div>

          <div class="screen-card">
            <div class="screen-chrome">
              <span class="phase-badge" id="phase-badge">Idle</span>
              <span class="round-badge" id="round-count">0 / 24</span>
              <span
                class="result-badge"
                id="result-badge"
                aria-live="polite"
              ></span>
            </div>

            <div class="screen">
              <div class="timer-track" aria-hidden="true">
                <div class="timer-fill" id="timer-fill"></div>
              </div>
              <div class="problem-display" id="problem-display">N-Back Math</div>
            </div>
          </div>

          <dl class="finish-summary" id="finish-summary" hidden>
            <div>
              <dt>Correct</dt>
              <dd id="correct-count">0</dd>
            </div>
            <div>
              <dt>Missed</dt>
              <dd id="missed-count">0</dd>
            </div>
            <div>
              <dt>Accuracy</dt>
              <dd id="accuracy-count">0%</dd>
            </div>
          </dl>

          <section class="answer-panel" aria-label="Answer entry">
            <div class="answer-row">
              <div class="answer-value empty" id="answer-value">0</div>
              <button class="answer-clear" id="clear-btn" type="button">
                CLR
              </button>
            </div>
            <div class="keypad" id="keypad"></div>
          </section>
        </section>
      </section>

      <section class="view" id="stats-view" aria-label="Stats">
        <section class="stats-page" aria-label="Progress stats">
          <div class="stats-head">
            <div>
              <h2>Progress</h2>
            </div>
            <div class="stats-actions">
              <button class="secondary" id="game-tab" type="button">
                Home
              </button>
            </div>
          </div>

          <dl class="stats-grid lifetime">
            <div>
              <dt>Runs</dt>
              <dd id="lifetime-runs">0</dd>
            </div>
            <div>
              <dt>Accuracy</dt>
              <dd id="lifetime-accuracy">0%</dd>
            </div>
            <div>
              <dt>Best Run</dt>
              <dd id="best-accuracy">0%</dd>
            </div>
            <div>
              <dt>Best Streak</dt>
              <dd id="best-streak">0</dd>
            </div>
          </dl>

          <section class="stats-section">
            <div class="section-head">
              <h3>Level Map</h3>
              <span id="stored-level-label">Slow 1-back</span>
            </div>
            <div class="level-map" id="level-map"></div>
          </section>

          <section class="stats-section">
            <div class="section-head">
              <h3>Recent Runs</h3>
              <span id="recent-count">0 saved</span>
            </div>
            <div class="history-list" id="history-list"></div>
          </section>

          <div class="stats-footer">
            <div class="resource-links" aria-label="Resources">
              <a
                class="icon-link"
                href="https://github.com/zeulewan/n-back-math"
                target="_blank"
                rel="noreferrer"
                aria-label="Open GitHub repository"
                title="GitHub repository"
              >
                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M12 2C6.48 2 2 6.58 2 12.22c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49v-1.9c-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.9 1.56 2.35 1.11 2.92.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.33 9.33 0 0 1 12 6.91c.85 0 1.7.12 2.5.34 1.9-1.32 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9v2.82c0 .27.18.59.69.49A10.12 10.12 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z"
                  />
                </svg>
              </a>
              <a
                class="icon-link"
                href="docs.html"
                aria-label="Open docs"
                title="Docs"
              >
                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M5.75 3A2.75 2.75 0 0 0 3 5.75v12.5A2.75 2.75 0 0 0 5.75 21h12.5A2.75 2.75 0 0 0 21 18.25V5.75A2.75 2.75 0 0 0 18.25 3H5.75Zm0 1.5h12.5c.69 0 1.25.56 1.25 1.25v12.5c0 .69-.56 1.25-1.25 1.25H5.75c-.69 0-1.25-.56-1.25-1.25V5.75c0-.69.56-1.25 1.25-1.25Zm2 3.25A.75.75 0 0 0 7 8.5v7a.75.75 0 0 0 1.13.65L12 13.9l3.87 2.25A.75.75 0 0 0 17 15.5v-7a.75.75 0 0 0-.75-.75h-8.5Zm.75 1.5h7v4.95l-3.12-1.82a.75.75 0 0 0-.76 0L8.5 14.2V9.25Z"
                  />
                </svg>
              </a>
            </div>
            <button class="danger" id="clear-progress-btn" type="button">
              Clear Progress
            </button>
          </div>
        </section>
      </section>
    </main>

    <script src="app.js?v=20260508k"></script>
  </body>
</html>
